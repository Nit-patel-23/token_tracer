name: Feature request
description: Suggest an improvement
title: '[feat]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analytics / charts
        - Team collaboration
        - Auth / roles
        - Daemon / ingest
        - Admin
        - Performance
        - DX / docs
        - Other
    validations:
      required: true
