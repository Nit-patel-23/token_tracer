name: Bug report
description: Report unexpected behavior
title: '[bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Token Tracer. Security issues → see SECURITY.md (do not file publicly).
  - type: textarea
    id: describe
    attributes:
      label: Description
      description: Clear summary of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Sign in as …
        2. Open …
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Personal dashboard
        - Team dashboard
        - Admin panel
        - Auth / login
        - Ingest / daemon
        - API
        - Docs / DX
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'Browser, Node, OS, self-host vs Vercel'
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant errors (redact secrets)
